<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="The requested shortlink was not found on this server.">
    <title>Link Not Found | Mercury</title>
    <!-- Roboto & Product Sans / Inter fonts from Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Outfit:wght@300;400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Dark Glassmorphism color palette */
            --bg-app: radial-gradient(circle at 50% 0%, #151226 0%, #08070d 100%);
            --bg-glass: rgba(22, 20, 38, 0.7);
            --border-glass: rgba(255, 255, 255, 0.08);
            --primary: #9d4edd;
            --primary-light: #c77dff;
            --accent: #ff007f;
            --on-surface: #f3f4f6;
            --on-surface-variant: #9ca3af;
            --error: #ff4d6d;
            --error-container: rgba(255, 77, 109, 0.12);
            
            --md-shape-corner-medium: 16px;
            --md-shape-corner-large: 24px;
            
            --glow-shadow: 0 0 20px rgba(157, 78, 221, 0.15);
            --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
            
            --font-title: 'Outfit', sans-serif;
            --font-body: 'Roboto', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            transition: background-color 0.25s, border-color 0.25s, box-shadow 0.25s, transform 0.25s;
        }

        body {
            font-family: var(--font-body);
            background: var(--bg-app);
            background-attachment: fixed;
            color: var(--on-surface);
            line-height: 1.5;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        /* Ambient background glow elements */
        .ambient-glow {
            position: fixed;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            pointer-events: none;
            z-index: -1;
            filter: blur(100px);
            opacity: 0.2;
        }
        
        .bg-glow {
            background: var(--primary);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .card {
            background: var(--bg-glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 48px 40px;
            border-radius: var(--md-shape-corner-large);
            border: 1px solid var(--border-glass);
            text-align: center;
            max-width: 460px;
            width: 90%;
            box-shadow: var(--glass-shadow);
            position: relative;
            z-index: 1;
        }

        .icon-container {
            width: 88px;
            height: 88px;
            border-radius: 50%;
            background-color: var(--error-container);
            border: 1px solid rgba(255, 77, 109, 0.2);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 28px;
        }

        .icon {
            font-size: 44px;
            color: var(--error);
        }

        h1 {
            font-family: var(--font-title);
            font-size: 26px;
            font-weight: 700;
            margin: 0 0 12px 0;
            color: var(--on-surface);
            letter-spacing: -0.5px;
        }

        p {
            color: var(--on-surface-variant);
            font-size: 15px;
            margin: 0 0 36px 0;
            line-height: 1.6;
        }

        .btn-back {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: #ffffff;
            text-decoration: none;
            padding: 0 28px;
            height: 48px;
            border-radius: 24px;
            font-family: var(--font-title);
            font-weight: 600;
            font-size: 14px;
            box-shadow: 0 4px 15px 0 rgba(157, 78, 221, 0.25);
            transition: all 0.25s ease;
        }

        .btn-back:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px 0 rgba(157, 78, 221, 0.4);
        }
        
        .btn-back:active {
            transform: translateY(1px);
        }
    </style>
</head>
<body>
    <div class="ambient-glow bg-glow"></div>

    <div class="card">
        <div class="icon-container">
            <span class="material-symbols-outlined icon">link_off</span>
        </div>
        <h1>Short Link Not Found</h1>
        <p>We couldn't find a destination URL for this key. Please double check the link or register it in the dashboard.</p>
        <a id="back-link" href="#" class="btn-back">
            <span class="material-symbols-outlined" style="font-size: 18px;">arrow_back</span>
            Back to Dashboard
        </a>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const host = window.location.host;
            // Strip "mercury." subdomain prefix dynamically to get root dashboard URL
            const dashboardHost = host.replace(/^mercury\./i, '');
            const protocol = window.location.protocol;
            const backLink = document.getElementById('back-link');
            if (backLink) {
                backLink.href = `${protocol}//${dashboardHost}/`;
            }
        });
    </script>
</body>
</html>
