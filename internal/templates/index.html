<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Manage your high-performance shortlinks securely with the Mercury Link Manager dashboard.">
    <title>Mercury Link Manager</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* CSS reset & variables */
        :root {
            --bg-app: #070708;
            --bg-card: #121214;
            --bg-input: #070708;
            --text-primary: #FFFFFF;
            --text-secondary: #E4E4E7;
            --text-muted: #A1A1AA;
            --accent-blue: #0071e3;
            --accent-green: #30D158;
            --accent-red: #FF453A;
            --border-thin: #27272A;
            --border-radius: 8px;
            --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --font-mono: 'JetBrains Mono', SFMono-Regular, Consolas, monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-sans);
            background-color: var(--bg-app);
            color: var(--text-primary);
            line-height: 1.5;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Webkit scrollbars */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-app);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border-thin);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #3F3F46;
        }

        /* Top Header */
        .app-bar {
            height: 56px;
            background: var(--bg-app);
            border-bottom: 1px solid var(--border-thin);
            display: flex;
            align-items: center;
            padding: 0 24px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .app-logo-container {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo-icon {
            color: var(--text-primary);
        }

        .app-logo {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
            letter-spacing: -0.3px;
        }

        .app-tagline {
            font-size: 12px;
            color: var(--text-muted);
            border-left: 1px solid var(--border-thin);
            padding-left: 8px;
            margin-left: 8px;
        }

        /* Layout Container */
        .container {
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            padding: 40px 24px;
            display: grid;
            grid-template-columns: 360px 1fr;
            gap: 32px;
            flex-grow: 1;
        }

        @media (max-width: 900px) {
            .container {
                grid-template-columns: 1fr;
                padding: 24px 16px;
                gap: 24px;
            }
        }

        /* Sidebar & Main */
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .main-content {
            display: flex;
            flex-direction: column;
            gap: 24px;
            min-width: 0;
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border-thin);
            border-radius: var(--border-radius);
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .stat-label {
            font-size: 11px;
            font-weight: 500;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-value {
            font-family: var(--font-mono);
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* Premium Cards */
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-thin);
            border-radius: var(--border-radius);
            padding: 24px;
        }

        .card-title {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Form Inputs */
        .form-group {
            margin-bottom: 18px;
        }

        .form-label {
            display: block;
            font-size: 12px;
            font-weight: 500;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .text-field-outlined {
            width: 100%;
            height: 40px;
            padding: 0 12px;
            font-size: 14px;
            font-family: var(--font-sans);
            border: 1px solid var(--border-thin);
            border-radius: var(--border-radius);
            background: var(--bg-input);
            color: var(--text-primary);
            outline: none;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }

        .text-field-outlined::placeholder {
            color: #52525B;
        }

        .text-field-outlined:focus {
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 2px rgba(0, 113, 227, 0.25);
        }

        /* Button Styling */
        .btn-filled {
            width: 100%;
            height: 40px;
            background: var(--accent-blue);
            color: var(--text-primary);
            border: none;
            border-radius: var(--border-radius);
            font-family: var(--font-sans);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: background-color 0.15s ease, box-shadow 0.15s ease;
        }

        .btn-filled:hover {
            background-color: #0077ed;
        }

        .btn-filled:focus {
            outline: none;
            box-shadow: 0 0 0 2px rgba(0, 113, 227, 0.4);
        }

        .btn-filled:active {
            background-color: #0062c3;
        }

        /* Search Input container */
        .search-container {
            position: relative;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
        }

        .search-field {
            width: 100%;
            height: 38px;
            padding: 0 12px 0 36px;
            font-size: 13px;
            font-family: var(--font-sans);
            border: 1px solid var(--border-thin);
            border-radius: var(--border-radius);
            background: var(--bg-input);
            color: var(--text-primary);
            outline: none;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }

        .search-field::placeholder {
            color: #52525B;
        }

        .search-field:focus {
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 2px rgba(0, 113, 227, 0.25);
        }

        .search-icon {
            position: absolute;
            left: 12px;
            color: var(--text-muted);
            pointer-events: none;
        }

        .btn-clear {
            position: absolute;
            right: 10px;
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            width: 20px;
            height: 20px;
            padding: 0;
            transition: color 0.15s ease, background-color 0.15s ease;
        }

        .btn-clear:hover {
            background-color: rgba(255, 255, 255, 0.05);
            color: var(--text-primary);
        }

        /* Dynamic Links container */
        .links-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Link Items (Premium Search Engine style) */
        .link-item {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 16px;
            background: var(--bg-card);
            border: 1px solid var(--border-thin);
            border-radius: var(--border-radius);
            gap: 16px;
            transition: border-color 0.15s ease, box-shadow 0.15s ease, transform 0.15s ease;
        }

        .link-item:hover {
            border-color: var(--accent-blue);
            box-shadow: 0 4px 12px rgba(0, 113, 227, 0.05);
        }

        .link-item-content {
            display: flex;
            flex-direction: column;
            gap: 6px;
            min-width: 0;
            flex-grow: 1;
        }

        .link-item-header {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .short-url-link {
            font-family: var(--font-mono);
            font-size: 14px;
            font-weight: 500;
            color: var(--text-secondary);
            text-decoration: none;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            border-bottom: 1px solid transparent;
            transition: border-color 0.15s ease, color 0.15s ease;
        }

        .short-url-link:hover {
            color: var(--accent-blue);
            border-bottom-color: var(--accent-blue);
        }

        .link-item-summary {
            font-family: var(--font-sans);
            font-size: 13px;
            line-height: 1.4;
            color: var(--text-muted);
            word-break: break-word;
        }

        .no-summary {
            color: #52525B;
            font-style: italic;
        }

        .link-item-destination {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 11px;
            color: #52525B;
            min-width: 0;
        }

        .dest-icon {
            flex-shrink: 0;
            color: #52525B;
        }

        .destination-link {
            color: #52525B;
            text-decoration: none;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            transition: color 0.15s ease;
        }

        .destination-link:hover {
            color: var(--text-muted);
        }

        .link-item-meta {
            font-size: 10px;
            color: #52525B;
        }

        .link-item-actions {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .action-btn {
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-input);
            border: 1px solid var(--border-thin);
            border-radius: 6px;
            color: var(--text-muted);
            cursor: pointer;
            text-decoration: none;
            transition: color 0.15s ease, border-color 0.15s ease, background-color 0.15s ease;
        }

        .action-btn:hover {
            color: var(--text-primary);
            border-color: var(--accent-blue);
            background-color: var(--bg-card);
        }

        .action-btn-delete:hover {
            color: var(--accent-red);
            border-color: var(--accent-red);
        }

        .action-btn:focus-visible {
            outline: none;
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 2px rgba(0, 113, 227, 0.2);
        }

        /* Empty State */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 48px 24px;
            color: #52525B;
            text-align: center;
            gap: 12px;
        }

        .empty-state svg {
            color: var(--border-thin);
        }

        .empty-state p {
            font-size: 13px;
        }

        /* Toast Container */
        .toast-container {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(16px);
            background: var(--bg-card);
            border: 1px solid var(--border-thin);
            color: var(--text-primary);
            padding: 12px 18px;
            border-radius: var(--border-radius);
            font-size: 13px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.2s ease, transform 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: none;
        }

        .toast-container.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .toast-success {
            border-left: 3px solid var(--accent-green);
        }

        .toast-error {
            border-left: 3px solid var(--accent-red);
        }
    </style>
</head>
<body>

    <header class="app-bar">
        <div class="app-logo-container">
            <svg class="logo-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
                <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
            </svg>
            <span class="app-logo">Mercury</span>
            <span class="app-tagline">Link Manager</span>
        </div>
    </header>

    <main class="container">
        <!-- Sidebar Form & Stats -->
        <aside class="sidebar">
            <!-- Stats -->
            <div class="stats-grid">
                <div class="stat-card">
                    <span class="stat-label">Total Keys</span>
                    <span class="stat-value" id="total-links-count">0</span>
                </div>
                <div class="stat-card">
                    <span class="stat-label">Domain</span>
                    <span class="stat-value" id="target-domain-val">loading...</span>
                </div>
            </div>

            <!-- Form -->
            <div class="card">
                <h2 class="card-title">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                    Shorten a link
                </h2>
                <form id="shorten-form">
                    <div class="form-group">
                        <label for="key" class="form-label">Short Key</label>
                        <input type="text" id="key" class="text-field-outlined" placeholder="e.g. search" required autocomplete="off">
                    </div>
                    <div class="form-group">
                        <label for="url" class="form-label">Destination URL</label>
                        <input type="text" id="url" class="text-field-outlined" placeholder="https://example.com" required autocomplete="off">
                    </div>
                    <div class="form-group">
                        <label for="summary" class="form-label">Summary Snippet</label>
                        <input type="text" id="summary" class="text-field-outlined" placeholder="Why did you save this link?" autocomplete="off">
                    </div>
                    <button type="submit" class="btn-filled">
                        Create Short URL
                    </button>
                </form>
            </div>
        </aside>

        <!-- Main Content (Links List) -->
        <section class="main-content">
            <div class="card">
                <h2 class="card-title">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <line x1="8" y1="6" x2="21" y2="6"></line>
                        <line x1="8" y1="12" x2="21" y2="12"></line>
                        <line x1="8" y1="18" x2="21" y2="18"></line>
                        <line x1="3" y1="6" x2="3.01" y2="6"></line>
                        <line x1="3" y1="12" x2="3.01" y2="12"></line>
                        <line x1="3" y1="18" x2="3.01" y2="18"></line>
                    </svg>
                    Active Redirection Keys
                </h2>
                
                <!-- Search container -->
                <div class="search-container">
                    <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    <input type="text" id="search-input" class="search-field" placeholder="Search keys, URLs, or summaries...">
                    <button id="search-clear" class="btn-clear" style="display: none;" title="Clear search">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <line x1="18" y1="6" x2="6" y2="18"></line>
                            <line x1="6" y1="6" x2="18" y2="18"></line>
                        </svg>
                    </button>
                </div>

                <div id="links-list-container" class="links-container">
                    <!-- Dynamic Link Items will go here -->
                    <div class="empty-state" id="empty-state">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
                            <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
                            <line x1="2" y1="2" x2="22" y2="22"></line>
                        </svg>
                        <p>No active short links found. Create one to get started!</p>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- Toast Notification -->
    <div id="toast" class="toast-container" role="alert">
        <span id="toast-msg">Link created successfully</span>
    </div>

    <script>
        const shortenForm = document.getElementById('shorten-form');
        const linksListContainer = document.getElementById('links-list-container');
        const emptyState = document.getElementById('empty-state');
        const toast = document.getElementById('toast');
        const toastMsg = document.getElementById('toast-msg');
        const searchInput = document.getElementById('search-input');
        const searchClear = document.getElementById('search-clear');

        let allLinks = [];
        let showToastTimeout;

        function showNotification(message, isSuccess = true) {
            toastMsg.textContent = message;
            toast.className = 'toast-container'; // reset classes
            if (isSuccess) {
                toast.classList.add('toast-success');
            } else {
                toast.classList.add('toast-error');
            }
            toast.classList.add('show');
            clearTimeout(showToastTimeout);
            showToastTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        async function getResponseData(response) {
            const contentType = response.headers.get('content-type');
            if (contentType && contentType.includes('application/json')) {
                return await response.json();
            }
            const text = await response.text();
            return { error: text || 'Unknown error occurred' };
        }

        async function fetchLinks() {
            try {
                const response = await fetch('/api/links');
                if (!response.ok) {
                    throw new Error('Failed to load links');
                }
                allLinks = await response.json();
                updateStats();
                filterAndRenderLinks();
            } catch (error) {
                console.error(error);
                showNotification('Error loading links: ' + error.message, false);
            }
        }

        function updateStats() {
            document.getElementById('total-links-count').textContent = allLinks.length;
            if (allLinks.length > 0 && allLinks[0].domain) {
                const domain = allLinks[0].domain;
                // Strip port for a cleaner look if present
                document.getElementById('target-domain-val').textContent = domain.split(':')[0];
            } else {
                document.getElementById('target-domain-val').textContent = 'communist.mom';
            }
        }

        function filterAndRenderLinks() {
            const query = searchInput.value.toLowerCase().trim();
            const filtered = allLinks.filter(link => {
                const summary = localStorage.getItem('mercury_meta_' + link.key) || '';
                return link.key.toLowerCase().includes(query) || 
                       link.url.toLowerCase().includes(query) ||
                       summary.toLowerCase().includes(query) ||
                       (link.domain && link.domain.toLowerCase().includes(query));
            });
            renderLinks(filtered);
        }

        function renderLinks(links) {
            const items = (links || []).map(link => {
                const shortUrl = `http://mercury.${link.domain}/${link.key}`;
                const summary = localStorage.getItem('mercury_meta_' + link.key) || '';
                
                return `
                    <div class="link-item">
                        <div class="link-item-content">
                            <div class="link-item-header">
                                <a href="${shortUrl}" target="_blank" rel="noopener noreferrer" class="short-url-link">${shortUrl}</a>
                            </div>
                            <div class="link-item-summary">
                                ${summary ? escapeHtml(summary) : '<span class="no-summary">No summary snippet available.</span>'}
                            </div>
                            <div class="link-item-destination">
                                <svg class="dest-icon" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
                                    <line x1="5" y1="12" x2="19" y2="12"></line>
                                    <polyline points="12 5 19 12 12 19"></polyline>
                                </svg>
                                <a href="${escapeHtml(link.url)}" target="_blank" rel="noopener noreferrer" class="destination-link" title="${escapeHtml(link.url)}">${escapeHtml(link.url)}</a>
                            </div>
                            <div class="link-item-meta">
                                Created on ${new Date(link.created_at).toLocaleDateString()} at ${new Date(link.created_at).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}
                            </div>
                        </div>
                        <div class="link-item-actions">
                            <button class="action-btn" onclick="copyToClipboard('${shortUrl}', this)" aria-label="Copy Link" title="Copy Link">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                                    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                                </svg>
                            </button>
                            <a href="${shortUrl}" target="_blank" rel="noopener noreferrer" class="action-btn" aria-label="Open Link in new tab" title="Open Link">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
                                    <polyline points="15 3 21 3 21 9"></polyline>
                                    <line x1="10" y1="14" x2="21" y2="3"></line>
                                </svg>
                            </a>
                            <button class="action-btn action-btn-delete" onclick="deleteLink('${link.key}')" aria-label="Delete Link" title="Delete Link">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <polyline points="3 6 5 6 21 6"></polyline>
                                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                                </svg>
                            </button>
                        </div>
                    </div>
                `;
            });

            if (items.length === 0) {
                linksListContainer.innerHTML = '';
                linksListContainer.appendChild(emptyState);
                emptyState.style.display = 'flex';
            } else {
                emptyState.style.display = 'none';
                linksListContainer.innerHTML = items.join('');
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.innerText = text;
            return div.innerHTML;
        }

        async function copyToClipboard(text, btnElement) {
            try {
                await navigator.clipboard.writeText(text);
                showNotification('Copied short URL to clipboard!');
                
                const svgElement = btnElement.querySelector('svg');
                const originalHTML = svgElement.outerHTML;
                
                btnElement.style.color = 'var(--accent-green)';
                btnElement.style.borderColor = 'var(--accent-green)';
                btnElement.innerHTML = `
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="20 6 9 17 4 12"></polyline>
                    </svg>
                `;
                
                setTimeout(() => {
                    btnElement.style.color = '';
                    btnElement.style.borderColor = '';
                    btnElement.innerHTML = originalHTML;
                }, 1500);
            } catch (err) {
                showNotification('Failed to copy link', false);
            }
        }

        // Live filtering event listeners
        searchInput.addEventListener('input', () => {
            if (searchInput.value.length > 0) {
                searchClear.style.display = 'flex';
            } else {
                searchClear.style.display = 'none';
            }
            filterAndRenderLinks();
        });

        searchClear.addEventListener('click', () => {
            searchInput.value = '';
            searchClear.style.display = 'none';
            filterAndRenderLinks();
            searchInput.focus();
        });

        shortenForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const key = document.getElementById('key').value.trim();
            let url = document.getElementById('url').value.trim();
            const summary = document.getElementById('summary').value.trim();

            if (!key || !url) return;

            // Automatically prepend https:// if no protocol is present
            if (!/^https?:\/\//i.test(url)) {
                url = 'https://' + url;
                document.getElementById('url').value = url;
            }

            try {
                const response = await fetch('/api/shorten', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ key, url })
                });

                const result = await getResponseData(response);
                if (!response.ok) {
                    throw new Error(result.error || 'Failed to create link');
                }

                // If successful, save summary to localStorage
                if (summary) {
                    localStorage.setItem('mercury_meta_' + key, summary);
                }

                showNotification('Link created successfully!');
                document.getElementById('key').value = '';
                document.getElementById('url').value = '';
                document.getElementById('summary').value = '';
                
                document.getElementById('key').blur();
                document.getElementById('url').blur();
                document.getElementById('summary').blur();
                
                fetchLinks();
            } catch (error) {
                showNotification(error.message, false);
            }
        });

        async function deleteLink(key) {
            if (!confirm(`Are you sure you want to delete the redirect key "${key}"?`)) {
                return;
            }

            try {
                const response = await fetch(`/api/links/${encodeURIComponent(key)}`, {
                    method: 'DELETE'
                });

                if (!response.ok) {
                    const result = await getResponseData(response);
                    throw new Error(result.error || 'Failed to delete link');
                }

                // If successful, clean up localStorage summary
                localStorage.removeItem('mercury_meta_' + key);

                showNotification('Link deleted successfully');
                fetchLinks();
            } catch (error) {
                showNotification(error.message, false);
            }
        }

        // Initialize
        fetchLinks();
    </script>
</body>
</html>
