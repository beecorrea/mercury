<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Manage your high-performance shortlinks securely with the Mercury URL Shortener dashboard.">
    <title>Mercury URL Shortener</title>
    <!-- Roboto & Product Sans / Inter fonts from Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Outfit:wght@300;400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Dark Glassmorphism color palette */
            --bg-app: radial-gradient(circle at 50% 0%, #151226 0%, #08070d 100%);
            --bg-glass: rgba(22, 20, 38, 0.65);
            --bg-glass-hover: rgba(30, 27, 52, 0.8);
            --border-glass: rgba(255, 255, 255, 0.07);
            --border-glass-hover: rgba(255, 255, 255, 0.12);
            --primary: #9d4edd; /* Neon purple/violet */
            --primary-light: #c77dff;
            --primary-glow: rgba(157, 78, 221, 0.25);
            --accent: #ff007f; /* Vibrant neon pink */
            --on-surface: #f3f4f6;
            --on-surface-variant: #9ca3af;
            --outline: rgba(255, 255, 255, 0.15);
            --outline-focus: #9d4edd;
            --error: #ff4d6d;
            --error-container: rgba(255, 77, 109, 0.15);
            --success: #06d6a0;
            --success-glow: rgba(6, 214, 160, 0.2);
            
            --md-shape-corner-small: 10px;
            --md-shape-corner-medium: 16px;
            --md-shape-corner-large: 24px;
            --md-shape-corner-extra-large: 32px;
            
            --glow-shadow: 0 0 20px rgba(157, 78, 221, 0.15);
            --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            
            --font-title: 'Outfit', sans-serif;
            --font-body: 'Roboto', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            transition: background-color 0.25s, border-color 0.25s, box-shadow 0.25s, transform 0.25s;
        }

        body {
            font-family: var(--font-body);
            background: var(--bg-app);
            background-attachment: fixed;
            color: var(--on-surface);
            line-height: 1.5;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Ambient background glow elements */
        .ambient-glow {
            position: fixed;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            pointer-events: none;
            z-index: -1;
            filter: blur(120px);
            opacity: 0.15;
        }
        
        .bg-glow-1 {
            background: var(--primary);
            top: -200px;
            left: 5%;
        }
        
        .bg-glow-2 {
            background: var(--accent);
            bottom: -200px;
            right: 5%;
        }

        /* Top App Bar */
        .app-bar {
            height: 72px;
            background: rgba(13, 11, 23, 0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 32px;
            border-bottom: 1px solid var(--border-glass);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .app-logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .app-logo {
            font-family: var(--font-title);
            font-weight: 700;
            font-size: 24px;
            background: linear-gradient(135deg, #c77dff, #ff007f);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .app-logo .logo-icon {
            font-size: 32px;
            color: #c77dff !important;
            -webkit-text-fill-color: initial;
            animation: float 3s ease-in-out infinite;
        }

        .app-subtitle {
            font-size: 14px;
            color: var(--on-surface-variant);
            margin-left: 12px;
            border-left: 1px solid var(--border-glass);
            padding-left: 12px;
            font-weight: 400;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-4px); }
            100% { transform: translateY(0px); }
        }

        /* Container & Layout */
        .container {
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            padding: 32px 24px;
            display: grid;
            grid-template-columns: 380px 1fr;
            gap: 32px;
            flex-grow: 1;
        }

        @media (max-width: 900px) {
            .container {
                grid-template-columns: 1fr;
                padding: 20px 16px;
                gap: 24px;
            }
        }

        /* Sidebar & Layout Elements */
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .main-content {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        /* Statistics Panel */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        
        .stat-card {
            background: var(--bg-glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-glass);
            border-radius: var(--md-shape-corner-medium);
            padding: 16px 20px;
            display: flex;
            align-items: center;
            gap: 16px;
            box-shadow: var(--glass-shadow);
        }
        
        .stat-icon-wrapper {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            background: rgba(157, 78, 221, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary-light);
        }
        
        .stat-icon-wrapper span {
            font-size: 24px;
        }
        
        .stat-info {
            display: flex;
            flex-direction: column;
            min-width: 0;
        }
        
        .stat-label {
            font-size: 11px;
            color: var(--on-surface-variant);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            white-space: nowrap;
        }
        
        .stat-value {
            font-family: var(--font-title);
            font-size: 20px;
            font-weight: 700;
            color: var(--on-surface);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* Cards */
        .card {
            background: var(--bg-glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: var(--md-shape-corner-large);
            padding: 28px;
            border: 1px solid var(--border-glass);
            box-shadow: var(--glass-shadow);
        }

        .card-title {
            font-family: var(--font-title);
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 24px;
            color: var(--on-surface);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card-title span {
            color: var(--primary-light);
        }

        /* Form Inputs */
        .form-group {
            position: relative;
            margin-bottom: 24px;
        }

        .text-field-outlined {
            width: 100%;
            padding: 16px;
            font-size: 15px;
            font-family: var(--font-body);
            border: 1px solid var(--outline);
            border-radius: var(--md-shape-corner-small);
            background: rgba(255, 255, 255, 0.03);
            color: var(--on-surface);
            outline: none;
            transition: all 0.2s ease;
        }

        .text-field-outlined:focus {
            border-color: var(--outline-focus);
            background: rgba(255, 255, 255, 0.05);
            box-shadow: 0 0 0 4px var(--primary-glow);
        }

        .floating-label {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            padding: 0 4px;
            color: var(--on-surface-variant);
            font-size: 15px;
            pointer-events: none;
            transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1) all;
        }

        .text-field-outlined:focus ~ .floating-label,
        .text-field-outlined:not(:placeholder-shown) ~ .floating-label {
            top: 0;
            font-size: 11px;
            color: var(--primary-light);
            background: #110e1d; /* Solid color covering backdrop line */
            font-weight: 500;
        }

        /* Material Button */
        .btn-filled {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: #ffffff;
            border: none;
            padding: 0 24px;
            height: 50px;
            font-size: 15px;
            font-weight: 600;
            font-family: var(--font-title);
            border-radius: var(--md-shape-corner-extra-large);
            cursor: pointer;
            width: 100%;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 15px 0 rgba(157, 78, 221, 0.25);
            transition: all 0.25s ease;
        }

        .btn-filled:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px 0 rgba(157, 78, 221, 0.4);
        }

        .btn-filled:active {
            transform: translateY(1px);
        }

        /* Search Input */
        .search-container {
            position: relative;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
        }
        
        .search-field {
            width: 100%;
            padding: 14px 44px 14px 44px;
            font-size: 14px;
            font-family: var(--font-body);
            border: 1px solid var(--outline);
            border-radius: var(--md-shape-corner-small);
            background: rgba(255, 255, 255, 0.03);
            color: var(--on-surface);
            outline: none;
            transition: all 0.2s ease;
        }
        
        .search-field:focus {
            border-color: var(--outline-focus);
            background: rgba(255, 255, 255, 0.05);
            box-shadow: 0 0 0 4px var(--primary-glow);
        }
        
        .search-icon {
            position: absolute;
            left: 14px;
            color: var(--on-surface-variant);
            pointer-events: none;
        }
        
        .btn-clear {
            position: absolute;
            right: 14px;
            background: none;
            border: none;
            color: var(--on-surface-variant);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            transition: background-color 0.2s;
        }
        
        .btn-clear:hover {
            background-color: rgba(255, 255, 255, 0.1);
            color: var(--on-surface);
        }

        /* Links List */
        .links-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .link-item {
            display: grid;
            grid-template-columns: 1fr auto;
            align-items: center;
            padding: 18px 24px;
            border-radius: var(--md-shape-corner-medium);
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-glass);
            gap: 16px;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .link-item:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: var(--outline-focus);
            box-shadow: 0 4px 15px 0 rgba(157, 78, 221, 0.1);
            transform: translateX(4px);
        }

        .link-info {
            display: flex;
            flex-direction: column;
            gap: 6px;
            min-width: 0;
        }

        .short-url-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .short-url-link {
            font-family: var(--font-title);
            font-weight: 600;
            font-size: 16px;
            color: var(--primary-light);
            text-decoration: none;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            letter-spacing: -0.3px;
        }

        .short-url-link:hover {
            text-decoration: underline;
        }

        .btn-icon-copy {
            background: none;
            border: none;
            color: var(--on-surface-variant);
            cursor: pointer;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .btn-icon-copy:hover {
            background-color: rgba(255, 255, 255, 0.08);
            color: var(--primary-light);
            transform: scale(1.1);
        }
        
        .btn-icon-copy.copied {
            color: var(--success) !important;
        }

        .long-url-row {
            font-size: 13px;
            color: var(--on-surface-variant);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .long-url-row span {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .meta-row {
            font-size: 11px;
            color: var(--on-surface-variant);
            opacity: 0.6;
            margin-top: 2px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .link-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-icon-delete {
            background: none;
            border: none;
            color: var(--on-surface-variant);
            cursor: pointer;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .btn-icon-delete:hover {
            background-color: var(--error-container);
            color: var(--error);
            transform: scale(1.05);
        }

        /* Empty state */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 56px 24px;
            color: var(--on-surface-variant);
            text-align: center;
            gap: 16px;
        }

        .empty-state span {
            font-size: 56px;
            color: var(--outline);
            animation: pulse 2s infinite ease-in-out;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.05); opacity: 0.8; }
            100% { transform: scale(1); opacity: 0.5; }
        }

        /* Toast Notifications */
        .toast-container {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(22, 20, 38, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-glass);
            color: var(--on-surface);
            padding: 14px 28px;
            border-radius: var(--md-shape-corner-medium);
            font-size: 14px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            z-index: 1000;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
        }

        .toast-container.show {
            transform: translateX(-50%) translateY(0);
        }

        .toast-container .icon {
            font-size: 20px;
        }
    </style>
</head>
<body>

    <div class="ambient-glow bg-glow-1"></div>
    <div class="ambient-glow bg-glow-2"></div>

    <header class="app-bar">
        <div class="app-logo-container">
            <h1 class="app-logo">
                <span class="material-symbols-outlined logo-icon">link</span>
                Mercury
            </h1>
            <span class="app-subtitle">URL Shortener</span>
        </div>
    </header>

    <main class="container">
        <!-- Sidebar Form & Stats -->
        <aside class="sidebar">
            <!-- Stats -->
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-icon-wrapper">
                        <span class="material-symbols-outlined">link</span>
                    </div>
                    <div class="stat-info">
                        <span class="stat-label">Total Keys</span>
                        <span class="stat-value" id="total-links-count">0</span>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon-wrapper">
                        <span class="material-symbols-outlined">dns</span>
                    </div>
                    <div class="stat-info">
                        <span class="stat-label">Domain</span>
                        <span class="stat-value" id="target-domain-val">loading...</span>
                    </div>
                </div>
            </div>

            <!-- Form -->
            <div class="card">
                <h2 class="card-title">
                    <span class="material-symbols-outlined">add_link</span>
                    Shorten a link
                </h2>
                <form id="shorten-form">
                    <div class="form-group">
                        <input type="text" id="key" class="text-field-outlined" placeholder=" " required autocomplete="off">
                        <label for="key" class="floating-label">Short Key (e.g. search)</label>
                    </div>
                    <div class="form-group">
                        <input type="text" id="url" class="text-field-outlined" placeholder=" " required autocomplete="off">
                        <label for="url" class="floating-label">Destination URL</label>
                    </div>
                    <button type="submit" class="btn-filled">
                        <span class="material-symbols-outlined">bolt</span>
                        Create Short URL
                    </button>
                </form>
            </div>
        </aside>

        <!-- Main Content (Links List) -->
        <section class="main-content">
            <div class="card">
                <h2 class="card-title">
                    <span class="material-symbols-outlined">list</span>
                    Active Redirection Keys
                </h2>
                
                <!-- Search container -->
                <div class="search-container">
                    <span class="material-symbols-outlined search-icon">search</span>
                    <input type="text" id="search-input" class="search-field" placeholder="Search keys or destination URLs...">
                    <button id="search-clear" class="btn-clear" style="display: none;" title="Clear search">
                        <span class="material-symbols-outlined" style="font-size: 18px;">close</span>
                    </button>
                </div>

                <div id="links-list-container" class="links-container">
                    <!-- Dynamic Link Items will go here -->
                    <div class="empty-state" id="empty-state">
                        <span class="material-symbols-outlined">link_off</span>
                        <p>No active short links found. Create one to get started!</p>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- Toast Notification -->
    <div id="toast" class="toast-container">
        <span class="material-symbols-outlined icon" id="toast-icon">info</span>
        <span id="toast-msg">Link created successfully</span>
    </div>

    <script>
        const shortenForm = document.getElementById('shorten-form');
        const linksListContainer = document.getElementById('links-list-container');
        const emptyState = document.getElementById('empty-state');
        const toast = document.getElementById('toast');
        const toastMsg = document.getElementById('toast-msg');
        const toastIcon = document.getElementById('toast-icon');
        const searchInput = document.getElementById('search-input');
        const searchClear = document.getElementById('search-clear');

        let allLinks = [];
        let showToastTimeout;

        function showNotification(message, isSuccess = true) {
            toastMsg.textContent = message;
            toastIcon.textContent = isSuccess ? 'check_circle' : 'error';
            toastIcon.style.color = isSuccess ? '#06d6a0' : '#ff4d6d';
            toast.classList.add('show');
            clearTimeout(showToastTimeout);
            showToastTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        async function getResponseData(response) {
            const contentType = response.headers.get('content-type');
            if (contentType && contentType.includes('application/json')) {
                return await response.json();
            }
            const text = await response.text();
            return { error: text || 'Unknown error occurred' };
        }

        async function fetchLinks() {
            try {
                const response = await fetch('/api/links');
                if (!response.ok) {
                    throw new Error('Failed to load links');
                }
                allLinks = await response.json();
                updateStats();
                filterAndRenderLinks();
            } catch (error) {
                console.error(error);
                showNotification('Error loading links: ' + error.message, false);
            }
        }

        function updateStats() {
            document.getElementById('total-links-count').textContent = allLinks.length;
            if (allLinks.length > 0 && allLinks[0].domain) {
                const domain = allLinks[0].domain;
                // Strip port for a cleaner look if present
                document.getElementById('target-domain-val').textContent = domain.split(':')[0];
            } else {
                document.getElementById('target-domain-val').textContent = 'communist.mom';
            }
        }

        function filterAndRenderLinks() {
            const query = searchInput.value.toLowerCase().trim();
            const filtered = allLinks.filter(link => {
                return link.key.toLowerCase().includes(query) || 
                       link.url.toLowerCase().includes(query) ||
                       (link.domain && link.domain.toLowerCase().includes(query));
            });
            renderLinks(filtered);
        }

        function renderLinks(links) {
            const items = (links || []).map(link => {
                const shortUrl = `http://mercury.${link.domain}/${link.key}`;
                return `
                    <div class="link-item">
                        <div class="link-info">
                            <div class="short-url-row">
                                <a href="${shortUrl}" target="_blank" class="short-url-link">${shortUrl}</a>
                                <button class="btn-icon-copy" onclick="copyToClipboard('${shortUrl}', this)" title="Copy link">
                                    <span class="material-symbols-outlined" style="font-size: 18px;">content_copy</span>
                                </button>
                            </div>
                            <div class="long-url-row">
                                <span class="material-symbols-outlined" style="font-size: 14px; vertical-align: middle;">arrow_forward</span>
                                <span>${escapeHtml(link.url)}</span>
                            </div>
                            <div class="meta-row">
                                <span class="material-symbols-outlined" style="font-size: 11px;">schedule</span>
                                Created on: ${new Date(link.created_at).toLocaleString()}
                            </div>
                        </div>
                        <div class="link-actions">
                            <button class="btn-icon-delete" onclick="deleteLink('${link.key}')" title="Delete link">
                                <span class="material-symbols-outlined">delete</span>
                            </button>
                        </div>
                    </div>
                `;
            });

            if (items.length === 0) {
                linksListContainer.innerHTML = '';
                linksListContainer.appendChild(emptyState);
                emptyState.style.display = 'flex';
            } else {
                emptyState.style.display = 'none';
                linksListContainer.innerHTML = items.join('');
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.innerText = text;
            return div.innerHTML;
        }

        async function copyToClipboard(text, btnElement) {
            try {
                await navigator.clipboard.writeText(text);
                showNotification('Copied short URL to clipboard!');
                
                // Visual feedback micro-animation on the copy button
                const iconElement = btnElement.querySelector('span');
                iconElement.textContent = 'check';
                btnElement.classList.add('copied');
                
                setTimeout(() => {
                    iconElement.textContent = 'content_copy';
                    btnElement.classList.remove('copied');
                }, 2000);
            } catch (err) {
                showNotification('Failed to copy link', false);
            }
        }

        // Live filtering event listeners
        searchInput.addEventListener('input', () => {
            if (searchInput.value.length > 0) {
                searchClear.style.display = 'flex';
            } else {
                searchClear.style.display = 'none';
            }
            filterAndRenderLinks();
        });

        searchClear.addEventListener('click', () => {
            searchInput.value = '';
            searchClear.style.display = 'none';
            filterAndRenderLinks();
            searchInput.focus();
        });

        shortenForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const key = document.getElementById('key').value.trim();
            let url = document.getElementById('url').value.trim();

            if (!key || !url) return;

            // Automatically prepend https:// if no protocol is present
            if (!/^https?:\/\//i.test(url)) {
                url = 'https://' + url;
                document.getElementById('url').value = url;
            }

            try {
                const response = await fetch('/api/shorten', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ key, url })
                });

                const result = await getResponseData(response);
                if (!response.ok) {
                    throw new Error(result.error || 'Failed to create link');
                }

                showNotification('Link created successfully!');
                document.getElementById('key').value = '';
                document.getElementById('url').value = '';
                // Focus out floating labels
                document.getElementById('key').blur();
                document.getElementById('url').blur();
                
                fetchLinks();
            } catch (error) {
                showNotification(error.message, false);
            }
        });

        async function deleteLink(key) {
            if (!confirm(`Are you sure you want to delete the redirect key "${key}"?`)) {
                return;
            }

            try {
                const response = await fetch(`/api/links/${encodeURIComponent(key)}`, {
                    method: 'DELETE'
                });

                if (!response.ok) {
                    const result = await getResponseData(response);
                    throw new Error(result.error || 'Failed to delete link');
                }

                showNotification('Link deleted successfully');
                fetchLinks();
            } catch (error) {
                showNotification(error.message, false);
            }
        }

        // Initialize
        fetchLinks();
    </script>
</body>
</html>
