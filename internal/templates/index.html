<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mercury URL Shortener</title>
    <!-- Roboto & Product Sans / Inter fonts from Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Outfit:wght@300;400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Material 3 Light Theme Colors (Google Blue Core) */
            --md-sys-color-primary: #0b57d0;
            --md-sys-color-on-primary: #ffffff;
            --md-sys-color-primary-container: #d3e3fd;
            --md-sys-color-on-primary-container: #041e49;
            --md-sys-color-secondary: #00639b;
            --md-sys-color-on-secondary: #ffffff;
            --md-sys-color-surface: #f8fafd;
            --md-sys-color-surface-container: #ffffff;
            --md-sys-color-surface-container-high: #f0f4f9;
            --md-sys-color-on-surface: #1f1f1f;
            --md-sys-color-on-surface-variant: #444746;
            --md-sys-color-outline: #74777f;
            --md-sys-color-outline-variant: #c4c7c5;
            --md-sys-color-error: #ba1a1a;
            --md-sys-color-error-container: #ffdad6;
            --md-sys-color-on-error: #ffffff;
            --md-sys-color-success: #146c2e;
            
            --md-shape-corner-small: 8px;
            --md-shape-corner-medium: 12px;
            --md-shape-corner-large: 16px;
            --md-shape-corner-extra-large: 28px;
            
            --md-elevation-1: 0px 1px 3px 1px rgba(0, 0, 0, 0.15), 0px 1px 2px 0px rgba(0, 0, 0, 0.30);
            --md-elevation-2: 0px 2px 6px 2px rgba(0, 0, 0, 0.15), 0px 1px 2px 0px rgba(0, 0, 0, 0.30);
            --md-elevation-3: 0px 4px 8px 3px rgba(0, 0, 0, 0.15), 0px 1px 3px 0px rgba(0, 0, 0, 0.30);
            
            --font-title: 'Outfit', sans-serif;
            --font-body: 'Roboto', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            transition: background-color 0.2s, border-color 0.2s, box-shadow 0.2s;
        }

        body {
            font-family: var(--font-body);
            background-color: var(--md-sys-color-surface);
            color: var(--md-sys-color-on-surface);
            line-height: 1.5;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Top App Bar */
        .app-bar {
            height: 64px;
            background-color: var(--md-sys-color-surface-container-high);
            display: flex;
            align-items: center;
            padding: 0 24px;
            border-bottom: 1px solid var(--md-sys-color-outline-variant);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .app-logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .app-logo {
            font-family: var(--font-title);
            font-weight: 700;
            font-size: 22px;
            color: var(--md-sys-color-primary);
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .app-logo .logo-icon {
            font-size: 28px;
            color: var(--md-sys-color-primary);
        }

        .app-subtitle {
            font-size: 14px;
            color: var(--md-sys-color-on-surface-variant);
            margin-left: 12px;
            border-left: 1px solid var(--md-sys-color-outline-variant);
            padding-left: 12px;
        }

        /* Container & Layout */
        .container {
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            padding: 32px 24px;
            display: grid;
            grid-template-columns: 380px 1fr;
            gap: 32px;
            flex-grow: 1;
        }

        @media (max-width: 900px) {
            .container {
                grid-template-columns: 1fr;
            }
        }

        /* Cards */
        .card {
            background-color: var(--md-sys-color-surface-container);
            border-radius: var(--md-shape-corner-large);
            padding: 24px;
            border: 1px solid var(--md-sys-color-outline-variant);
            box-shadow: 0px 1px 2px rgba(0, 0, 0, 0.05);
        }

        .card:hover {
            box-shadow: var(--md-elevation-1);
        }

        .card-title {
            font-family: var(--font-title);
            font-size: 20px;
            font-weight: 500;
            margin-bottom: 20px;
            color: var(--md-sys-color-on-surface);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Form Inputs */
        .form-group {
            position: relative;
            margin-bottom: 20px;
        }

        .text-field-outlined {
            width: 100%;
            padding: 16px;
            font-size: 16px;
            font-family: var(--font-body);
            border: 1px solid var(--md-sys-color-outline);
            border-radius: var(--md-shape-corner-small);
            background: transparent;
            color: var(--md-sys-color-on-surface);
            outline: none;
        }

        .text-field-outlined:focus {
            border: 2px solid var(--md-sys-color-primary);
            padding: 15px; /* Adjust padding for 2px border */
        }

        .floating-label {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            background-color: var(--md-sys-color-surface-container);
            padding: 0 4px;
            color: var(--md-sys-color-on-surface-variant);
            font-size: 16px;
            pointer-events: none;
            transition: 0.15s ease all;
        }

        .text-field-outlined:focus ~ .floating-label,
        .text-field-outlined:not(:placeholder-shown) ~ .floating-label {
            top: 0;
            font-size: 12px;
            color: var(--md-sys-color-primary);
            font-weight: 500;
        }

        .text-field-outlined:focus ~ .floating-label {
            color: var(--md-sys-color-primary);
        }

        /* Material Button */
        .btn-filled {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background-color: var(--md-sys-color-primary);
            color: var(--md-sys-color-on-primary);
            border: none;
            padding: 0 24px;
            height: 48px;
            font-size: 14px;
            font-weight: 500;
            font-family: var(--font-title);
            border-radius: var(--md-shape-corner-extra-large);
            cursor: pointer;
            width: 100%;
            position: relative;
            overflow: hidden;
            box-shadow: 0px 1px 2px rgba(0, 0, 0, 0.05);
        }

        .btn-filled:hover {
            box-shadow: var(--md-elevation-1);
            background-color: #0b57d0ea;
        }

        .btn-filled:active {
            background-color: #041e49;
        }

        /* Links List */
        .links-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .link-item {
            display: grid;
            grid-template-columns: 1fr auto;
            align-items: center;
            padding: 16px 20px;
            border-radius: var(--md-shape-corner-medium);
            background-color: var(--md-sys-color-surface-container-high);
            border: 1px solid var(--md-sys-color-outline-variant);
            gap: 16px;
        }

        .link-item:hover {
            box-shadow: var(--md-elevation-1);
            border-color: var(--md-sys-color-outline);
        }

        .link-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-width: 0; /* Ensures text-overflow ellipsis works inside grid */
        }

        .short-url-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .short-url-link {
            font-family: var(--font-title);
            font-weight: 600;
            font-size: 16px;
            color: var(--md-sys-color-primary);
            text-decoration: none;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .short-url-link:hover {
            text-decoration: underline;
        }

        .btn-icon-copy {
            background: none;
            border: none;
            color: var(--md-sys-color-on-surface-variant);
            cursor: pointer;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-icon-copy:hover {
            background-color: rgba(0, 0, 0, 0.05);
            color: var(--md-sys-color-primary);
        }

        .long-url-row {
            font-size: 13px;
            color: var(--md-sys-color-on-surface-variant);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .long-url-row span {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .meta-row {
            font-size: 11px;
            color: var(--md-sys-color-outline);
            margin-top: 2px;
        }

        .link-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-icon-delete {
            background: none;
            border: none;
            color: var(--md-sys-color-outline);
            cursor: pointer;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-icon-delete:hover {
            background-color: var(--md-sys-color-error-container);
            color: var(--md-sys-color-error);
        }

        /* Empty state */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 48px 24px;
            color: var(--md-sys-color-on-surface-variant);
            text-align: center;
            gap: 12px;
        }

        .empty-state span {
            font-size: 48px;
            color: var(--md-sys-color-outline-variant);
        }

        /* Toast Notifications */
        .toast-container {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background-color: #313033;
            color: #f4eff4;
            padding: 14px 24px;
            border-radius: 4px;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: var(--md-elevation-3);
            z-index: 1000;
            transition: transform 0.3s cubic-bezier(0.05, 0.7, 0.1, 1.0);
            pointer-events: none;
        }

        .toast-container.show {
            transform: translateX(-50%) translateY(0);
        }

        .toast-container .icon {
            color: #d3e3fd;
            font-size: 20px;
        }
    </style>
</head>
<body>

    <header class="app-bar">
        <div class="app-logo-container">
            <div class="app-logo">
                <span class="material-symbols-outlined logo-icon">link</span>
                Mercury
            </div>
            <span class="app-subtitle">SRE URL Shortener</span>
        </div>
    </header>

    <main class="container">
        <!-- Sidebar Form -->
        <aside class="sidebar">
            <div class="card">
                <h2 class="card-title">
                    <span class="material-symbols-outlined">add_link</span>
                    Shorten a link
                </h2>
                <form id="shorten-form">
                    <div class="form-group">
                        <input type="text" id="domain" class="text-field-outlined" placeholder=" " required value="communist.mom">
                        <label for="domain" class="floating-label">Domain (e.g. communist.mom, dev)</label>
                    </div>
                    <div class="form-group">
                        <input type="text" id="key" class="text-field-outlined" placeholder=" " required>
                        <label for="key" class="floating-label">Short Key (e.g. search)</label>
                    </div>
                    <div class="form-group">
                        <input type="text" id="url" class="text-field-outlined" placeholder=" " required>
                        <label for="url" class="floating-label">Destination URL</label>
                    </div>
                    <button type="submit" class="btn-filled">
                        <span class="material-symbols-outlined">bolt</span>
                        Create Short URL
                    </button>
                </form>
            </div>
        </aside>

        <!-- Main Content (Links List) -->
        <section class="main-content">
            <div class="card">
                <h2 class="card-title">
                    <span class="material-symbols-outlined">list</span>
                    Active Redirection Keys
                </h2>
                <div id="links-list-container" class="links-container">
                    <!-- Dynamic Link Items will go here -->
                    <div class="empty-state" id="empty-state">
                        <span class="material-symbols-outlined">link_off</span>
                        <p>No active short links found. Create one above to get started!</p>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- Toast Notification -->
    <div id="toast" class="toast-container">
        <span class="material-symbols-outlined icon" id="toast-icon">info</span>
        <span id="toast-msg">Link created successfully</span>
    </div>

    <script>
        const shortenForm = document.getElementById('shorten-form');
        const linksListContainer = document.getElementById('links-list-container');
        const emptyState = document.getElementById('empty-state');
        const toast = document.getElementById('toast');
        const toastMsg = document.getElementById('toast-msg');
        const toastIcon = document.getElementById('toast-icon');

        let showToastTimeout;
        function showNotification(message, isSuccess = true) {
            toastMsg.textContent = message;
            toastIcon.textContent = isSuccess ? 'check_circle' : 'error';
            toastIcon.style.color = isSuccess ? '#b4eeb4' : '#ffb4b4';
            toast.classList.add('show');
            clearTimeout(showToastTimeout);
            showToastTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        async function getResponseData(response) {
            const contentType = response.headers.get('content-type');
            if (contentType && contentType.includes('application/json')) {
                return await response.json();
            }
            const text = await response.text();
            return { error: text || 'Unknown error occurred' };
        }

        async function fetchLinks() {
            try {
                const response = await fetch('/api/links');
                if (!response.ok) {
                    throw new Error('Failed to load links');
                }
                const links = await response.json();
                renderLinks(links);
            } catch (error) {
                console.error(error);
                showNotification('Error loading links: ' + error.message, false);
            }
        }

        function renderLinks(links) {
            // Keep the empty state element in memory
            const items = (links || []).map(link => {
                const cleanDomain = link.domain.split(':')[0];
                const shortUrl = `http://mercury.${cleanDomain}/${link.key}`;
                return `
                    <div class="link-item">
                        <div class="link-info">
                            <div class="short-url-row">
                                <a href="${shortUrl}" target="_blank" class="short-url-link">${shortUrl}</a>
                                <button class="btn-icon-copy" onclick="copyToClipboard('${shortUrl}')" title="Copy link">
                                    <span class="material-symbols-outlined" style="font-size: 18px;">content_copy</span>
                                </button>
                            </div>
                            <div class="long-url-row">
                                <span class="material-symbols-outlined" style="font-size: 14px; vertical-align: middle;">arrow_forward</span>
                                <span>${escapeHtml(link.url)}</span>
                            </div>
                            <div class="meta-row">
                                Created on: ${new Date(link.created_at).toLocaleString()}
                            </div>
                        </div>
                        <div class="link-actions">
                            <button class="btn-icon-delete" onclick="deleteLink('${link.key}')" title="Delete link">
                                <span class="material-symbols-outlined">delete</span>
                            </button>
                        </div>
                    </div>
                `;
            });

            if (items.length === 0) {
                linksListContainer.innerHTML = '';
                linksListContainer.appendChild(emptyState);
                emptyState.style.display = 'flex';
            } else {
                emptyState.style.display = 'none';
                linksListContainer.innerHTML = items.join('');
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.innerText = text;
            return div.innerHTML;
        }

        async function copyToClipboard(text) {
            try {
                await navigator.clipboard.writeText(text);
                showNotification('Copied short URL to clipboard!');
            } catch (err) {
                showNotification('Failed to copy link', false);
            }
        }

        shortenForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const key = document.getElementById('key').value.trim();
            let domain = document.getElementById('domain').value.trim();
            let url = document.getElementById('url').value.trim();

            if (!key || !domain || !url) return;

            // Automatically prepend https:// if no protocol is present
            if (!/^https?:\/\//i.test(url)) {
                url = 'https://' + url;
                document.getElementById('url').value = url;
            }

            // Append port number if not already present
            if (!domain.includes(':')) {
                domain = `${domain}:${window.location.port || '45800'}`;
            }

            try {
                const response = await fetch('/api/shorten', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ key, domain, url })
                });

                const result = await getResponseData(response);
                if (!response.ok) {
                    throw new Error(result.error || 'Failed to create link');
                }

                showNotification('Link created successfully!');
                document.getElementById('key').value = '';
                document.getElementById('url').value = '';
                fetchLinks();
            } catch (error) {
                showNotification(error.message, false);
            }
        });

        async function deleteLink(key) {
            if (!confirm(`Are you sure you want to delete the redirect key "${key}"?`)) {
                return;
            }

            try {
                const response = await fetch(`/api/links/${encodeURIComponent(key)}`, {
                    method: 'DELETE'
                });

                if (!response.ok) {
                    const result = await getResponseData(response);
                    throw new Error(result.error || 'Failed to delete link');
                }

                showNotification('Link deleted successfully');
                fetchLinks();
            } catch (error) {
                showNotification(error.message, false);
            }
        }

        // Initialize
        fetchLinks();
    </script>
</body>
</html>
