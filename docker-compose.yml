services:
  mercury:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mercury
    ports:
      - "45800:45800"
    environment:
      - MERCURY_DB_PATH=/data/mercury.db
      - MERCURY_DOMAIN=communist.mom
      - MERCURY_PORT=45800
    volumes:
      - mercury_data:/data
    restart: unless-stopped

volumes:
  mercury_data:
